name: Build NEON WAVE APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'neon-wave-project.zip.base64'
      - '.github/workflows/build-neon-wave-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Decode Android project archive
        run: |
          base64 -d neon-wave-project.zip.base64 > neon-wave-project.zip
          unzip -q neon-wave-project.zip
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: neon-wave-android
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-wave-debug-apk
          path: neon-wave-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
